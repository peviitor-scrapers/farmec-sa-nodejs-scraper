name: WebScraper FARMEC to Peviitor

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Sync with remote
        if: github.event_name != 'pull_request'
        run: git pull origin main --rebase -X theirs

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run scraper
        run: node index.js
        env:
          SOLR_AUTH: ${{ secrets.SOLR_AUTH }}

      - name: Check for new jobs
        run: |
          if [ -f tmp/jobs.json ]; then
            echo "New jobs found:"
            cat tmp/jobs.json | jq '.jobs | length'
          else
            echo "No new jobs or scrape failed"
          fi

      - name: Upload jobs JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scraped-jobs
          path: |
            tmp/jobs.json
            tmp/jobs_existing.json
          retention-days: 7
